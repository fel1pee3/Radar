schemaVersion: 1
purpose: RADAR_FILE_POSE
# UUID fictício. A etapa 04 trabalha localmente, sem consultar a API.
cameraId: '11111111-1111-4111-8111-111111111111'
source:
  kind: FILE
  path: .local/videos/teste.mp4
  videoId: bancada-01
  # Altere somente depois de confirmar a autorização para processar esse arquivo.
  authorized: false
  rotation: AUTO
  allowTimestampFallback: true
model:
  # Lite preserva a configuração da 04; Full exige variant e path correspondentes.
  variant: lite
  path: .local/models/pose_landmarker_lite.task
processing:
  maxWidth: 640
  targetAnalysisFps: 5.0
  minLandmarkVisibility: 0.5
  # 0: tão rápido quanto possível; 1: ritmo original; 2: ritmo 2x.
  replaySpeed: 0.0
  preview: false
  # A CLI --preview-paused abre a prévia pausada; Espaço inicia/pausa/retoma.
  previewStartPaused: false
  maxObservations: null
calibrationPath: .local/calibration.json
diagnostics:
  outputDirectory: .local/results/edge
  exportObservations: false
  maxExportObservations: 1000
  maxExportBytes: 10485760
  # Diagnóstico de decisões, compartilhado com LIVE, sem imagens/vídeo.
  exportDecisions: false
  maxDecisionRecords: 10000
  maxDecisionBytes: 10485760
  maxDecisionDirectoryBytes: 52428800
  decisionRetentionDays: 7
# Etapa 05: habilite explicitamente em uma cópia privada. Configurações da 04
# continuam extraindo somente poses. SQLite dedicado a esta câmera.
events:
  enabled: false
  outboxPath: .local/edge/outbox.sqlite
  evidenceMode: skeleton
  # Snapshot real exige escolha OWNER na API e autorização local separada.
  snapshotAuthorized: false
  # Defaults centralizados floor-v0.1. Alterar parâmetros exige outra version.
  policy: {}
  delivery:
    enabled: false
    # JSON privado com apiUrl, cameraId e deviceToken, ou variáveis EDGE_*.
    credentialFile: null
    timeoutSeconds: 5.0
    maxItems: 10000
    maxBytes: 104857600
    confirmedRetentionDays: 7
