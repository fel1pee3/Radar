packages:
  - apps/*
  - packages/*

# Compiladores nativos necessários ao Next/Tailwind. Nenhum build arbitrário.
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - sharp
  - unrs-resolver
  - '@prisma/engines'
  - prisma
  - argon2

# Não necessários aos comandos usados; scarf é telemetria de instalação.
ignoredBuiltDependencies:
  - '@scarf/scarf'
  - '@parcel/watcher'
